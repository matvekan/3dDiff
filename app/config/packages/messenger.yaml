framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true
            sync: 'sync://'

        routing:
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async
            'App\Application\Command\Auth\SendPasswordResetEmailCommand': async
