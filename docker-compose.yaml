version: '3.8'

networks:
  symfony_network:
    name: 3Dnetwork

volumes:
  pg-data:

services:
  nginx:
    container_name: 3D_nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./app:/var/www
    depends_on:
      - php
    networks:
      - symfony_network

  php:
    container_name: 3D_php
    build:
      context: ./docker/php
    volumes:
      - ./app:/var/www
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/3dDiff?serverVersion=16&charset=utf8
    networks:
      - symfony_network
    depends_on:
      - postgres
      - redis

  messenger_worker:
    container_name: 3D_messenger_worker
    build:
      context: ./docker/php
    volumes:
      - ./app:/var/www
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --sleep=1 -vv
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/3dDiff?serverVersion=16&charset=utf8
    depends_on:
      - postgres
      - redis
    networks:
      - symfony_network

  postgres:
    image: postgres:16-alpine
    container_name: 3D-postgres
    environment:
      POSTGRES_DB: 3dDiff
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - symfony_network

  redis:
    container_name: 3D_redis
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - symfony_network